[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-qna-userbot"
version = "1.0.0"
description = "Fast, free AI Telegram Q&A Userbot with an interactive Dashboard Controller Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0,<4.0.0",
    "telethon>=1.39.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "httpx[http2]>=0.28.0,<1.0.0",
    "qrcode[pil]>=7.4.2,<9.0.0",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
tg-qna-userbot = "qna_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
